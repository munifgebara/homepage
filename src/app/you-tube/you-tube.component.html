<table class="table table-striped">
	<thead>
		<tr>
			<th scope="col">Imagem</th>
			<th scope="col">Descrição</th>
		</tr>
	</thead>
	<tbody>
		<tr *ngFor="let video of videos.items; index as i">
            <td><a target="_blank"  href="http://www.youtube.com/watch?v={{video.id.videoId}}"><img src="{{video.snippet.thumbnails.high.url}}"></a></td>
			<td>{{ video.snippet.publishedAt | date: 'dd/MM/yyyy'}}
			{{ video.snippet.title }}{{ video.snippet.title }}
            {{ video.snippet.description }}
		</tr>
	</tbody>
</table>
